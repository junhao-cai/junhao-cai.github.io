# ============================================================================
#  学术主页 nginx 配置
#  Astro trailingSlash:'always' 生成的是 目录/index.html 结构，
#  try_files 需要依次命中：精确文件 → 目录的 index.html → 目录重定向 → 404
# ============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩（文本类资源收益最大）
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff2;

    # Astro 指纹化静态资源：永久缓存
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # BibTeX 下载：保持正确的 MIME 与下载行为
    location = /cv.bib {
        default_type application/x-bibtex;
        add_header Content-Disposition 'attachment; filename="publications.bib"';
    }

    # 常规路由：文件 → 目录 index → 目录重定向 → 404
    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }

    # 自定义 404 页
    error_page 404 /404.html;

    # 基础安全头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
